<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ex04</title>
</head>
<body>

    <form action="#" method="post">
        <label for="full-name">Full Name</label>
        <input
            type="text" id="full-name" name="full-name" required minlength="5">

        <label for="email">Email</label>
        <input
            type="email" id="email" name="email" required minlength="10">

        <label for="password">Password</label>
        <input
            type="password" id="password" name="password" required minlength="10">

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="">Select a role</option>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
        </select>

        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <label for="about">About You</label>
        <textarea id="about" name="about" required minlength="10"></textarea>

        <input
            type="checkbox" id="agreement" name="agreement" required>
        <label for="agreement">I agree to the terms and conditions.</label>

        <button type="submit">Register</button>
    </form>

</body>
</html>
